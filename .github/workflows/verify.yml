name: Production verification
on: [push, pull_request, workflow_dispatch]
jobs:
  postgres-and-scanner:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verification"
          --health-interval 10s --health-timeout 5s --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        options: >-
          --health-cmd clamdcheck.sh --health-start-period 180s
          --health-interval 30s --health-timeout 10s --health-retries 20
    env:
      DJANGO_DEBUG: 'true'
      SYNTHETIC_MODE: 'true'
      DATABASE_URL: postgresql://verification:ci-only-ephemeral-password@127.0.0.1:5432/postgres
      DATABASE_SSLMODE: disable
      RUN_CLAMAV_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test tests --noinput
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deployment/.env.example -f deployment/compose.yaml config --quiet
      - run: docker build -f backend/Dockerfile -t secureai-backend:verify .
      - run: docker build -f frontend/Dockerfile -t secureai-web:verify .
      - run: docker run --rm -e PUBLIC_HOST=workspace.example.com -e TLS_EMAIL=ops@example.com secureai-web:verify caddy validate --config /etc/caddy/Caddyfile
