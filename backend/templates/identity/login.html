<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SecureAI · Local development sign-in</title><style>body{margin:0;background:#f6f8fb;color:#263348;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{background:white;border:1px solid #dde5f0;border-radius:16px;padding:36px;width:min(390px,80vw)}h1{font-size:26px}p{font-size:14px;color:#64748b;line-height:1.6}label{display:block;margin:20px 0;font-size:14px}input{box-sizing:border-box;display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #ccd7e6;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:13px;background:#294b83;color:white;width:100%;font:inherit;cursor:pointer}.error{color:#ad4545}small{display:block;margin-top:20px;color:#64748b}</style></head><body><main><h1>Sign in to SecureAI</h1><p>Synthetic development workspace. Production uses your organization’s identity provider.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required autofocus maxlength="150"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Continue to workspace</button></form><small>Use an account created by the seed_demo command.</small></main></body></html>
